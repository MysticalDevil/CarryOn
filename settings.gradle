pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenLocal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForged'
                    url = 'https://maven.neoforged.net/releases'
                }
            }
            filter {
                includeGroupAndSubgroups("net.neoforged")
            }
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net'
        }
    }
}



plugins {
    // 1.0.0 required: the 0.8.0 resolver references JvmVendorSpec.IBM_SEMERU,
    // which Gradle 9.5.1 removed, so any toolchain auto-provisioning aborted
    // with NoSuchFieldError from Foojay's static initialiser.  That broke
    // :NeoForge:runClient, whose run config requests a toolchain that is not
    // installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

if (System.getenv('BUILD_NUMBER') != null && System.getenv('TAG_NAME') == null) {
    version += "." + System.getenv('BUILD_NUMBER')
}

rootProject.name = 'CarryOn'
// Forge is intentionally excluded: this port targets Minecraft 26.3, where the
// upstream multiloader setup no longer ships a supported Forge variant.
include("Common", "Fabric", "NeoForge")
